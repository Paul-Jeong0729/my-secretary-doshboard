<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송촌1부 전도</title>
<style>
  :root{
    --bg-color:#0f172a;
    --card-bg:#1e293b;
    --accent-color:#a3e635;
    --blue:#bef264;
    --title-color:#f59e0b;
    --text-color:#f8fafc;
    --sub-text:#94a3b8;
    --border-color:#334155;
    --line-color: rgba(163,230,53,0.55);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at top, rgba(190,242,100,0.08), transparent 60%),
      var(--bg-color);
    color:var(--text-color);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding:36px 20px 80px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ===== 헤더 ===== */
  .page-header{
    text-align:center;
    margin-bottom:36px;
  }
  .page-header h1{
    display:inline-block;
    margin:0;
    font-size:1.6rem;
    font-weight:800;
    color:var(--title-color);
    letter-spacing:1px;
    text-shadow:0 0 14px rgba(245,158,11,0.45);
  }
  .page-header p{
    margin:8px 0 0;
    color:var(--sub-text);
    font-size:0.85rem;
    letter-spacing:0.5px;
  }

  /* ===== 메뉴 리스트 (세로) ===== */
  .menu-wrap{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(30,41,59,0.85);
    border:1.5px solid var(--accent-color);
    border-radius:12px;
    padding:18px 22px;
    box-shadow:0 0 14px rgba(163,230,53,0.18), inset 0 0 10px rgba(163,230,53,0.08);
    cursor:pointer;
    text-decoration:none;
    color:var(--text-color);
    transition:all 0.2s ease;
  }
  .menu-item:hover{
    background:rgba(163,230,53,0.1);
    box-shadow:0 0 20px rgba(163,230,53,0.35), inset 0 0 12px rgba(163,230,53,0.1);
    transform:translateY(-2px);
  }
  .menu-item .menu-name{
    font-size:1.05rem;
    font-weight:800;
    color:var(--text-color);
  }
  .menu-item .menu-arrow{
    color:var(--blue);
    font-size:1.1rem;
    font-weight:700;
  }

  /* ===== 닫기 버튼 ===== */
  .close-window-btn{
    position:fixed;
    top:18px;
    right:22px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(30,41,59,0.85);
    border:1.5px solid var(--accent-color);
    color:var(--accent-color);
    font-size:1.4rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10000;
    box-shadow:0 0 10px rgba(163,230,53,0.25);
    transition:all 0.2s ease;
  }
  .close-window-btn:hover{
    background:var(--accent-color);
    color:#0f172a;
    box-shadow:0 0 16px rgba(163,230,53,0.6);
    transform:scale(1.05);
  }
</style>
</head>
<body>

  <button type="button" id="closeWindowBtn" class="close-window-btn" title="창 닫기">&times;</button>

  <div class="page-header">
    <h1>📣 송촌1부 전도</h1>
    <p>메뉴를 선택해주세요</p>
  </div>

  <div class="menu-wrap">
    <div class="menu-item" data-menu="찾기">
      <span class="menu-name">🔍 찾기</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" data-menu="섭외자">
      <span class="menu-name">🤝 섭외자</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" data-menu="세미나">
      <span class="menu-name">🎤 세미나</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" data-menu="센타 수강">
      <span class="menu-name">🏫 센타 수강</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" data-menu="센타 등록">
      <span class="menu-name">📝 센타 등록</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>

<script>
  document.getElementById('closeWindowBtn').addEventListener('click', () => {
    window.close();
  });

  // 메뉴 클릭 시 동작 (추후 각 메뉴별 상세 페이지/기능 연결 예정)
  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      alert(`"${item.dataset.menu}" 메뉴는 준비 중입니다.`);
    });
  });
</script>
</body>
</html>
