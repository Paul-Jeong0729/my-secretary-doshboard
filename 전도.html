<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송촌1부 전도 관리</title>
<style>
  :root{
    --bg-color:#0f172a;
    --card-bg:#1e293b;
    --accent-color:#a3e635;
    --blue:#bef264;
    --title-color:#f59e0b;
    --text-color:#f8fafc;
    --sub-text:#94a3b8;
    --border-color:#334155;
    --line-color: rgba(163,230,53,0.55);
    --danger:#f87171;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at top, rgba(190,242,100,0.08), transparent 60%),
      var(--bg-color);
    color:var(--text-color);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding:32px 20px 120px;
    min-height:100vh;
  }

  /* ===== 헤더 ===== */
  .page-header{ text-align:center; margin-bottom:28px; }
  .page-header h1{
    display:inline-block; margin:0; font-size:1.5rem; font-weight:800;
    color:var(--title-color); letter-spacing:1px;
    text-shadow:0 0 14px rgba(245,158,11,0.45);
  }
  .page-header p{ margin:8px 0 0; color:var(--sub-text); font-size:0.85rem; }

  .main-wrap{ max-width:1180px; margin:0 auto; }

  /* ===== 상단 탭 (5단계) ===== */
  .stage-tabs{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    margin-bottom:26px;
  }
  .stage-tab{
    background:rgba(30,41,59,0.85);
    border:1.5px solid var(--border-color);
    color:var(--sub-text);
    font-weight:800; font-size:0.88rem;
    padding:10px 20px; border-radius:22px;
    cursor:pointer; transition:0.2s;
    display:flex; align-items:center; gap:6px;
  }
  .stage-tab .count-badge{
    background:rgba(163,230,53,0.15); color:var(--accent-color);
    border-radius:10px; padding:1px 8px; font-size:0.75rem;
  }
  .stage-tab:hover{ border-color:var(--accent-color); color:var(--text-color); }
  .stage-tab.active{
    background:linear-gradient(135deg, rgba(163,230,53,0.18), rgba(101,163,13,0.12));
    border-color:var(--accent-color); color:var(--text-color);
    box-shadow:0 0 14px rgba(163,230,53,0.25);
  }

  /* ===== 섹션 패널 ===== */
  .stage-panel{ display:none; }
  .stage-panel.active{ display:block; animation:fadeIn 0.25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .panel-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; gap:10px; flex-wrap:wrap;
  }
  .panel-title{ font-size:1.05rem; font-weight:800; color:var(--blue); }
  .panel-actions{ display:flex; align-items:center; gap:10px; }

  .icon-btn{
    background:rgba(30,41,59,0.85); border:1.5px solid var(--border-color);
    color:var(--sub-text); width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; cursor:pointer; transition:0.2s;
  }
  .icon-btn:hover{ color:var(--accent-color); border-color:var(--accent-color); }

  .create-btn{
    background:linear-gradient(135deg, #a3e635, #65a30d);
    color:#fff; border:none; font-weight:800; font-size:0.88rem;
    padding:10px 20px; border-radius:20px; cursor:pointer;
    box-shadow:0 0 12px rgba(163,230,53,0.35); transition:0.2s;
  }
  .create-btn:hover{ box-shadow:0 0 18px rgba(190,242,100,0.7); transform:translateY(-1px); }

  .search-box{
    display:none; align-items:center; gap:8px;
    background:rgba(30,41,59,0.9); border:1px solid var(--blue);
    border-radius:20px; padding:6px 14px;
  }
  .search-box.show{ display:flex; }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text-color);
    font-size:0.85rem; width:160px;
  }

  /* ===== 레코드 카드 ===== */
  .record-list{ display:flex; flex-direction:column; gap:14px; }
  .record-card{
    background:rgba(30,41,59,0.85);
    border:1px solid var(--border-color);
    border-left:3px solid var(--accent-color);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
  }
  .record-row{
    display:flex; align-items:center; gap:14px;
    flex-wrap:nowrap; overflow-x:auto;
    padding-bottom:10px; margin-bottom:10px;
    border-bottom:1px dashed var(--border-color);
  }
  .record-row::-webkit-scrollbar{ height:5px; }
  .record-row::-webkit-scrollbar-thumb{ background:var(--border-color); border-radius:4px; }

  .field-chip{ display:flex; flex-direction:column; gap:2px; min-width:70px; flex-shrink:0; }
  .field-chip .f-label{ font-size:0.66rem; color:var(--sub-text); font-weight:700; letter-spacing:0.5px; }
  .field-chip .f-value{ font-size:0.9rem; font-weight:700; color:var(--text-color); white-space:nowrap; }
  .field-chip.num .f-value{ color:var(--accent-color); }
  .field-chip.open-o .f-value{ color:var(--blue); }
  .field-chip.open-x .f-value{ color:var(--danger); }

  .stage-up-btn{
    flex-shrink:0; margin-left:auto;
    background:rgba(190,242,100,0.12); border:1px solid var(--blue);
    color:var(--blue); font-weight:800; font-size:0.78rem;
    padding:8px 14px; border-radius:16px; cursor:pointer; transition:0.2s;
    white-space:nowrap;
  }
  .stage-up-btn:hover{ background:var(--blue); color:#000; }
  .stage-up-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .record-note-row{ display:flex; align-items:flex-start; gap:10px; }
  .row-actions{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .row-actions button{
    border:none; border-radius:8px; padding:6px 12px; font-size:0.76rem; font-weight:800;
    cursor:pointer; transition:0.2s; white-space:nowrap;
  }
  .edit-mini-btn{ background:rgba(163,230,53,0.15); color:var(--accent-color); }
  .edit-mini-btn:hover{ background:var(--accent-color); color:#0f172a; }
  .delete-mini-btn{ background:rgba(248,113,113,0.15); color:var(--danger); }
  .delete-mini-btn:hover{ background:var(--danger); color:#fff; }

  .note-text{
    flex:1; font-size:0.85rem; color:var(--sub-text); line-height:1.5;
    background:rgba(10,15,26,0.35); border-radius:8px; padding:8px 12px;
    min-height:20px; white-space:pre-wrap;
  }

  .class-dates-row{
    display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;
  }
  .class-dates-row .cd-label{ font-size:0.72rem; color:var(--sub-text); font-weight:700; flex-shrink:0; }
  .class-dates-row .cd-chip{
    background:rgba(163,230,53,0.12); color:var(--accent-color);
    border-radius:10px; padding:3px 10px; font-size:0.78rem; font-weight:700;
  }
  .class-dates-row input[type="date"]{
    background:rgba(10,15,26,0.6); border:1px solid var(--border-color);
    border-radius:8px; color:var(--text-color); font-size:0.78rem; padding:5px 8px;
  }
  .class-dates-row .add-date-btn{
    background:rgba(190,242,100,0.15); border:1px solid var(--blue); color:var(--blue);
    font-size:0.76rem; font-weight:800; padding:5px 12px; border-radius:10px; cursor:pointer;
  }
  .class-dates-row .add-date-btn:hover{ background:var(--blue); color:#000; }

  .empty-state{
    text-align:center; color:var(--sub-text); font-size:0.88rem;
    padding:40px 0;
  }

  /* ===== 입력/수정 모달 ===== */
  .modal-overlay{
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    background:rgba(5,10,20,0.72); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:9999;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-card{
    width:640px; max-width:92%; max-height:88vh; overflow-y:auto;
    background:rgba(15,23,42,0.97); border:1.5px solid var(--blue);
    border-radius:16px; padding:24px 26px 22px;
    box-shadow:0 0 26px rgba(190,242,100,0.3);
  }
  .modal-title{
    color:var(--blue); font-weight:800; font-size:1.05rem; margin-bottom:18px;
    text-shadow:0 0 8px rgba(190,242,100,0.5);
  }
  .form-row-line{
    display:flex; flex-wrap:wrap; gap:12px; margin-bottom:14px;
  }
  .form-group{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:110px; }
  .form-group label{ font-size:0.74rem; color:var(--sub-text); font-weight:700; }
  .form-group input[type="text"],
  .form-group input[type="tel"],
  .form-group input[type="date"],
  .form-group select{
    background:rgba(10,15,26,0.6); border:1px solid var(--border-color);
    border-radius:8px; color:var(--text-color); font-size:0.85rem;
    padding:8px 10px; outline:none;
  }
  .form-group input:focus, .form-group select:focus{
    border-color:var(--accent-color); box-shadow:0 0 8px rgba(163,230,53,0.35);
  }
  .radio-group{ display:flex; gap:10px; align-items:center; padding-top:4px; }
  .radio-group label{ display:flex; align-items:center; gap:4px; font-size:0.85rem; color:var(--text-color); font-weight:700; cursor:pointer; }

  .form-group.full{ flex:1 1 100%; }
  .form-group textarea{
    background:rgba(10,15,26,0.6); border:1px solid var(--border-color);
    border-radius:8px; color:var(--text-color); font-size:0.85rem;
    padding:10px 12px; outline:none; resize:vertical; min-height:70px; font-family:inherit;
  }
  .form-group textarea:focus{ border-color:var(--accent-color); box-shadow:0 0 8px rgba(163,230,53,0.35); }

  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions button{
    flex:1; padding:11px 0; border-radius:10px; font-weight:800; font-size:0.9rem;
    cursor:pointer; border:none; transition:0.2s;
  }
  .modal-confirm-btn{ background:linear-gradient(135deg, #bef264, #84cc16); color:#fff; }
  .modal-confirm-btn:hover{ box-shadow:0 0 14px rgba(190,242,100,0.7); }
  .modal-cancel-btn{ background:rgba(255,255,255,0.06); border:1px solid var(--border-color) !important; color:var(--sub-text); }
  .modal-cancel-btn:hover{ color:var(--text-color); }

  /* ===== 확인(삭제) 모달 ===== */
  .confirm-card{
    width:320px; max-width:88%; background:rgba(15,23,42,0.97);
    border:1.5px solid var(--danger); border-radius:14px; padding:22px;
    box-shadow:0 0 22px rgba(248,113,113,0.3);
  }
  .confirm-card p{ font-size:0.9rem; margin:0 0 18px; color:var(--text-color); line-height:1.5; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{ flex:1; padding:10px 0; border-radius:8px; font-weight:800; font-size:0.86rem; border:none; cursor:pointer; }
  #confirmYesBtn{ background:var(--danger); color:#fff; }
  #confirmYesBtn:hover{ box-shadow:0 0 12px rgba(248,113,113,0.6); }
  #confirmNoBtn{ background:rgba(255,255,255,0.06); border:1px solid var(--border-color) !important; color:var(--sub-text); }

  .save-toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(10px);
    background:rgba(15,23,42,0.95); border:1px solid var(--blue); color:var(--blue);
    font-size:0.82rem; font-weight:700; padding:8px 18px; border-radius:20px;
    opacity:0; pointer-events:none; transition:all 0.25s ease; z-index:10001;
  }
  .save-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .save-toast.error{ border-color:#ef4444; color:#f87171; }

  .close-window-btn{
    position:fixed; top:18px; right:22px; width:38px; height:38px; border-radius:50%;
    background:rgba(30,41,59,0.85); border:1.5px solid var(--accent-color);
    color:var(--accent-color); font-size:1.4rem; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    z-index:10000; box-shadow:0 0 10px rgba(163,230,53,0.25); transition:all 0.2s ease;
  }
  .close-window-btn:hover{ background:var(--accent-color); color:#0f172a; box-shadow:0 0 16px rgba(163,230,53,0.6); transform:scale(1.05); }

  .main-content-hidden{ display:none !important; }

  /* ===== 로그인 오버레이 (구역.html과 동일) ===== */
  .login-overlay{
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    background: radial-gradient(ellipse at top, rgba(190,242,100,0.08), transparent 60%), rgba(5,10,20,0.92);
    backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:20000;
  }
  .login-overlay.hidden{ display:none; }
  .login-card{
    width:340px; max-width:90%; background:rgba(15,23,42,0.95);
    border:1.5px solid var(--accent-color); border-radius:16px;
    box-shadow:0 0 26px rgba(163,230,53,0.3); padding:28px 26px 24px;
  }
  .login-title{ margin:0 0 20px; text-align:center; font-size:1.15rem; font-weight:800; color:var(--title-color); }
  .login-form-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .login-form-group label{ font-size:0.78rem; font-weight:700; color:var(--sub-text); }
  .login-form-group input{
    width:100%; background:rgba(10,15,26,0.6); border:1px solid var(--border-color);
    border-radius:8px; color:var(--text-color); font-size:0.92rem; padding:10px 12px; outline:none;
  }
  .login-form-group input:focus{ border-color:var(--accent-color); box-shadow:0 0 10px rgba(163,230,53,0.4); }
  .login-error{ color:#f87171; font-size:0.78rem; font-weight:700; margin:-4px 0 14px; }
  .login-error.hidden{ display:none; }
  .login-submit-btn{
    width:100%; padding:11px 0; border:none; border-radius:8px;
    background:linear-gradient(135deg, #a3e635, #65a30d); color:#fff; font-weight:800; font-size:0.95rem; cursor:pointer;
  }
  .login-cancel-btn{
    width:100%; margin-top:10px; padding:11px 0; border-radius:8px;
    background:rgba(255,255,255,0.06); border:1px solid var(--border-color);
    color:var(--sub-text); font-weight:700; font-size:0.9rem; cursor:pointer; transition:0.2s;
  }
  .login-cancel-btn:hover{ color:var(--text-color); }
</style>
</head>
<body>

  <button type="button" id="closeWindowBtn" class="close-window-btn" title="창 닫기">&times;</button>

  <!-- 로그인 오버레이 -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2 class="login-title">🔐 로그인</h2>
      <div class="login-form-group">
        <label for="loginEmail">이메일</label>
        <input type="email" id="loginEmail" placeholder="이메일을 입력하세요" autocomplete="off" />
      </div>
      <div class="login-form-group">
        <label for="loginPassword">비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호를 입력하세요" autocomplete="new-password" />
      </div>
      <div class="login-error hidden" id="loginError"></div>
      <button type="button" class="login-submit-btn" id="loginSubmitBtn">로그인</button>
      <button type="button" class="login-cancel-btn" id="loginBackBtn">← 뒤로가기</button>
    </div>
  </div>

  <div id="mainContent" class="main-content-hidden">
    <div class="page-header">
      <h1>🙌 송촌1부 전도 관리</h1>
      <p>찾기 → 섭외자 → 세미나 → 센타 수강 → 센타 등록</p>
    </div>

    <div class="main-wrap">
      <div class="stage-tabs" id="stageTabs"></div>
      <div id="stagePanels"></div>
    </div>
  </div>

  <!-- 입력/수정 모달 -->
  <div class="modal-overlay hidden" id="formModalOverlay">
    <div class="modal-card">
      <div class="modal-title" id="formModalTitle">입력</div>
      <div class="form-row-line">
        <div class="form-group"><label>이름</label><input type="text" id="f_name" placeholder="이름"></div>
        <div class="form-group">
          <label>성별</label>
          <div class="radio-group">
            <label><input type="radio" name="f_gender" value="남"> 남</label>
            <label><input type="radio" name="f_gender" value="여"> 여</label>
          </div>
        </div>
        <div class="form-group"><label>생년월일</label><input type="date" id="f_birth"></div>
        <div class="form-group"><label>연락처</label><input type="tel" id="f_phone" placeholder="010-0000-0000"></div>
        <div class="form-group"><label>거주지</label><input type="text" id="f_address" placeholder="거주지"></div>
        <div class="form-group">
          <label>찾기 방법</label>
          <select id="f_method">
            <option value="지인">지인</option>
            <option value="소모임">소모임</option>
            <option value="노방">노방</option>
            <option value="전단지">전단지</option>
            <option value="좌판">좌판</option>
          </select>
        </div>
        <div class="form-group">
          <label>오픈여부</label>
          <div class="radio-group">
            <label><input type="radio" name="f_open" value="O"> O</label>
            <label><input type="radio" name="f_open" value="X"> X</label>
          </div>
        </div>
      </div>
      <div class="form-row-line">
        <div class="form-group full">
          <label>특이사항</label>
          <textarea id="f_note" placeholder="특이사항을 입력하세요"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-confirm-btn" id="formConfirmBtn">완료</button>
        <button type="button" class="modal-cancel-btn" id="formCancelBtn">취소</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay hidden" id="confirmModalOverlay">
    <div class="confirm-card">
      <p id="confirmMessage">정말 삭제하시겠습니까?</p>
      <div class="confirm-actions">
        <button type="button" id="confirmYesBtn">삭제</button>
        <button type="button" id="confirmNoBtn">취소</button>
      </div>
    </div>
  </div>

  <div class="save-toast" id="saveToast">저장되었습니다</div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/telegram-notify.js"></script>

<script>
  // ⚠️ 구역.html과 동일한 Firebase 프로젝트를 사용합니다.
  const firebaseConfig = {
    apiKey: "AIzaSyBVXo5NYSyumJxYFFE2hrIaTEJiHIyq8P0",
    authDomain: "my-secretary-1df10.firebaseapp.com",
    projectId: "my-secretary-1df10",
    storageBucket: "my-secretary-1df10.firebasestorage.app",
    messagingSenderId: "165274759452",
    appId: "1:165274759452:web:bbfa7de28a08f8e11b4ad9",
    measurementId: "G-TVB8JR7B3W"
  };
  const pageApp = firebase.initializeApp(firebaseConfig, 'evangelismPageApp');
  const auth = pageApp.auth();
  const db = pageApp.firestore();

  // ==========================================
  // 🚫 자동 로그인 방지
  // - persistence를 NONE으로 설정해 세션을 저장하지 않고
  // - 페이지가 열릴 때마다 남아있는 로그인 상태를 강제로 로그아웃시켜
  //   링크에 들어올 때마다 항상 빈 로그인 화면부터 시작하게 합니다.
  //   (이 페이지 전용 독립 앱 인스턴스라 홈 화면 등 다른 페이지의
  //    로그인 상태에는 영향을 주지 않습니다.)
  // ==========================================
  auth.setPersistence(firebase.auth.Auth.Persistence.NONE)
    .catch(err => console.error('Persistence 설정 오류:', err));

  // ---- 로그인 ----
  const loginOverlay = document.getElementById('loginOverlay');
  function clearLoginInputs() {
    ['loginEmail','loginPassword'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  }
  window.addEventListener('load', () => { setTimeout(clearLoginInputs, 50); });
  clearLoginInputs();
  const mainContent = document.getElementById('mainContent');
  const loginEmailInput = document.getElementById('loginEmail');
  const loginPasswordInput = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');
  const loginSubmitBtn = document.getElementById('loginSubmitBtn');

  function mapFirebaseError(err){
    const code = err && err.code ? err.code : '';
    switch(code){
      case 'auth/invalid-email': return '올바른 이메일 형식이 아닙니다.';
      case 'auth/user-not-found': return '가입되지 않은 이메일입니다.';
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return '이메일 또는 비밀번호가 올바르지 않습니다.';
      case 'auth/too-many-requests': return '너무 많은 시도가 있었습니다. 잠시 후 다시 시도해주세요.';
      case 'auth/network-request-failed': return '네트워크 연결을 확인해주세요.';
      case 'auth/api-key-not-valid':
      case 'auth/invalid-api-key': return 'Firebase 설정값이 아직 교체되지 않았습니다.';
      default: return '오류가 발생했습니다: ' + (err && err.message ? err.message : code);
    }
  }

  function attemptLogin(){
    const email = loginEmailInput.value.trim();
    const pw = loginPasswordInput.value;
    if(!email || !pw){ loginError.textContent='이메일과 비밀번호를 입력해주세요.'; loginError.classList.remove('hidden'); return; }
    loginError.classList.add('hidden');
    loginSubmitBtn.disabled = true;
    auth.signInWithEmailAndPassword(email, pw)
      .then(()=>{ loginPasswordInput.value=''; })
      .catch(err=>{ loginError.textContent = mapFirebaseError(err); loginError.classList.remove('hidden'); })
      .finally(()=>{ loginSubmitBtn.disabled = false; });
  }
  loginSubmitBtn.addEventListener('click', attemptLogin);
  [loginEmailInput, loginPasswordInput].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); attemptLogin(); } });
  });

  document.getElementById('closeWindowBtn').addEventListener('click', ()=> window.close());

  // 뒤로가기 버튼: 팝업으로 열렸으면 창을 닫아 홈으로 복귀, 아니면 브라우저 뒤로가기
  function goToHome() {
    if (window.opener && !window.opener.closed) {
      window.close();
    } else if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  }
  document.getElementById('loginBackBtn').addEventListener('click', goToHome);

  // 브라우저 캐시(bfcache)로 이 페이지에 되돌아왔을 때 이전 화면이 그대로
  // 남아있지 않도록 새로고침하여 로그인 상태를 다시 정확히 확인합니다.
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) window.location.reload();
  });

  auth.onAuthStateChanged(user=>{
    if(user){
      loginOverlay.classList.add('hidden');
      mainContent.classList.remove('main-content-hidden');
      initApp();
      maybeOpenFromQuery();
    } else {
      mainContent.classList.add('main-content-hidden');
      loginOverlay.classList.remove('hidden');
    }
  });

  // 🔗 활동.html '결과' 버튼에서 넘어온 경우, 찾기 탭 + 입력 모달을 자동으로 엽니다.
  function maybeOpenFromQuery(){
    const params = new URLSearchParams(window.location.search);
    if(params.get('open') === 'find_new'){
      switchStage('find');
      setTimeout(()=> openFormModal('find', null), 300);
    }
  }

  // ==========================================
  // 📋 5단계 구성
  // ==========================================
  const STAGES = [
    { id:'find',            label:'찾기',      collection:'evangelism_find',            next:'recruit',         hasCreate:true,  hasSearch:true,  hasNote:true, hasClassDate:false, editableCore:true },
    { id:'recruit',         label:'섭외자',    collection:'evangelism_recruit',         next:'seminar',         hasCreate:false, hasSearch:false, hasNote:true, hasClassDate:false, editableCore:true },
    { id:'seminar',         label:'세미나',    collection:'evangelism_seminar',         next:'center_class',    hasCreate:false, hasSearch:false, hasNote:true, hasClassDate:false, editableCore:true },
    { id:'center_class',    label:'센타 수강', collection:'evangelism_center_class',    next:'center_register', hasCreate:false, hasSearch:false, hasNote:true, hasClassDate:true,  editableCore:true },
    { id:'center_register', label:'센타 등록', collection:'evangelism_center_register', next:null,              hasCreate:false, hasSearch:false, hasNote:false,hasClassDate:false, editableCore:false }
  ];

  const stageData = {};   // id -> array of {id, ...fields}
  const stageUnsub = {};  // id -> unsubscribe fn
  let currentStageId = 'find';
  let findSearchTerm = '';

  // ---- 탭 / 패널 뼈대 생성 ----
  const tabsWrap = document.getElementById('stageTabs');
  const panelsWrap = document.getElementById('stagePanels');

  STAGES.forEach(stage=>{
    const tab = document.createElement('button');
    tab.type='button';
    tab.className='stage-tab' + (stage.id===currentStageId ? ' active' : '');
    tab.dataset.stage = stage.id;
    tab.innerHTML = `${stage.label} <span class="count-badge" id="count-${stage.id}">0</span>`;
    tab.addEventListener('click', ()=> switchStage(stage.id));
    tabsWrap.appendChild(tab);

    const panel = document.createElement('div');
    panel.className='stage-panel' + (stage.id===currentStageId ? ' active' : '');
    panel.id = `panel-${stage.id}`;
    panel.innerHTML = `
      <div class="panel-toolbar">
        <div class="panel-title">${stage.label} 명단</div>
        <div class="panel-actions">
          ${stage.hasSearch ? `
            <div class="search-box" id="searchBox-${stage.id}">
              <span>🔍</span>
              <input type="text" id="searchInput-${stage.id}" placeholder="이름으로 검색">
            </div>
            <button type="button" class="icon-btn" id="searchToggle-${stage.id}" title="검색">🔍</button>
          ` : ''}
          ${stage.hasCreate ? `<button type="button" class="create-btn" data-create-stage="${stage.id}">+ 입력</button>` : ''}
        </div>
      </div>
      <div class="record-list" id="list-${stage.id}"></div>
    `;
    panelsWrap.appendChild(panel);
  });

  function switchStage(stageId){
    currentStageId = stageId;
    document.querySelectorAll('.stage-tab').forEach(t=> t.classList.toggle('active', t.dataset.stage===stageId));
    document.querySelectorAll('.stage-panel').forEach(p=> p.classList.toggle('active', p.id === `panel-${stageId}`));
  }

  // 검색 토글 (찾기 탭)
  const findStage = STAGES.find(s=>s.id==='find');
  if(findStage){
    const toggleBtn = document.getElementById(`searchToggle-find`);
    const searchBox = document.getElementById(`searchBox-find`);
    const searchInput = document.getElementById(`searchInput-find`);
    toggleBtn.addEventListener('click', ()=>{
      searchBox.classList.toggle('show');
      if(searchBox.classList.contains('show')) searchInput.focus();
    });
    searchInput.addEventListener('input', ()=>{
      findSearchTerm = searchInput.value.trim();
      renderStage('find');
    });
  }

  // 입력(+) 버튼
  document.querySelectorAll('[data-create-stage]').forEach(btn=>{
    btn.addEventListener('click', ()=> openFormModal(btn.dataset.createStage, null));
  });

  // ==========================================
  // 🔥 Firestore 실시간 동기화
  // ==========================================
  function startAllSync(){
    STAGES.forEach(stage=>{
      if(stageUnsub[stage.id]) return;
      stageUnsub[stage.id] = db.collection(stage.collection)
        .orderBy('createdAt', 'asc')
        .onSnapshot(snap=>{
          stageData[stage.id] = [];
          snap.forEach(doc=> stageData[stage.id].push({ id: doc.id, ...doc.data() }));
          renderStage(stage.id);
        }, err=>{
          console.error(`${stage.id} 동기화 오류:`, err);
          showToast('데이터 동기화에 실패했습니다.', true);
        });
    });
  }

  function initApp(){ startAllSync(); }

  // ==========================================
  // 🖼️ 렌더링
  // ==========================================
  function fieldChip(label, value, extraClass){
    return `<div class="field-chip ${extraClass||''}"><span class="f-label">${label}</span><span class="f-value">${value===undefined||value===''?'-':escapeHtml(value)}</span></div>`;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderStage(stageId){
    const stage = STAGES.find(s=>s.id===stageId);
    const listEl = document.getElementById(`list-${stageId}`);
    const countEl = document.getElementById(`count-${stageId}`);
    let records = stageData[stageId] || [];

    if(stageId==='find' && findSearchTerm){
      records = records.filter(r => (r.name||'').includes(findSearchTerm));
    }

    countEl.textContent = (stageData[stageId]||[]).length;

    if(records.length===0){
      listEl.innerHTML = `<div class="empty-state">등록된 명단이 없습니다.</div>`;
      return;
    }

    listEl.innerHTML = records.map((r, idx)=>{
      const openClass = r.openStatus==='O' ? 'open-o' : (r.openStatus==='X' ? 'open-x' : '');
      const stageUpBtn = stage.next
        ? `<button type="button" class="stage-up-btn" data-stage-up="${stageId}" data-id="${r.id}">단계향상 ▶ ${STAGES.find(s=>s.id===stage.next).label}</button>`
        : '';

      const classDatesHtml = stage.hasClassDate ? `
        <div class="class-dates-row">
          <span class="cd-label">수강 일자</span>
          ${(r.classDates||[]).map(d=>`<span class="cd-chip">${d}</span>`).join('')}
          <input type="date" id="cd-input-${stageId}-${r.id}">
          <button type="button" class="add-date-btn" data-add-date="${stageId}" data-id="${r.id}">+ 날짜 추가</button>
        </div>
      ` : '';

      const noteRow = stage.hasNote ? `
        <div class="record-note-row">
          <div class="row-actions">
            <button type="button" class="edit-mini-btn" data-edit="${stageId}" data-id="${r.id}">수정</button>
            <button type="button" class="delete-mini-btn" data-delete="${stageId}" data-id="${r.id}">삭제</button>
          </div>
          <div class="note-text">${r.note ? escapeHtml(r.note) : '특이사항 없음'}</div>
        </div>
      ` : `
        <div class="record-note-row">
          <div class="row-actions">
            <button type="button" class="delete-mini-btn" data-delete="${stageId}" data-id="${r.id}">삭제</button>
          </div>
        </div>
      `;

      return `
        <div class="record-card">
          <div class="record-row">
            ${fieldChip('번호', idx+1, 'num')}
            ${fieldChip('이름', r.name)}
            ${fieldChip('성별', r.gender)}
            ${fieldChip('생년월일', r.birth)}
            ${fieldChip('연락처', r.phone)}
            ${fieldChip('거주지', r.address)}
            ${fieldChip('찾기방법', r.method)}
            ${fieldChip('오픈여부', r.openStatus, openClass)}
            ${stageUpBtn}
          </div>
          ${noteRow}
          ${classDatesHtml}
        </div>
      `;
    }).join('');
  }

  // ---- 이벤트 위임: 수정/삭제/단계향상/날짜추가 ----
  panelsWrap.addEventListener('click', (e)=>{
    const editBtn = e.target.closest('[data-edit]');
    if(editBtn){
      const stageId = editBtn.dataset.edit;
      const id = editBtn.dataset.id;
      const record = (stageData[stageId]||[]).find(r=>r.id===id);
      openFormModal(stageId, record);
      return;
    }
    const delBtn = e.target.closest('[data-delete]');
    if(delBtn){
      const stageId = delBtn.dataset.delete;
      const id = delBtn.dataset.id;
      const stageLabel = STAGES.find(s=>s.id===stageId).label;
      const targetRecord = (stageData[stageId]||[]).find(r=>r.id===id);
      const targetName = targetRecord ? targetRecord.name : '';
      openConfirmModal('정말 이 명단을 삭제하시겠습니까?', ()=>{
        db.collection(STAGES.find(s=>s.id===stageId).collection).doc(id).delete()
          .then(()=>{
            showToast('삭제되었습니다', false);
            notifyRecordChange('전도', '삭제', stageLabel, targetName);
          })
          .catch(err=>{ console.error(err); showToast('삭제에 실패했습니다.', true); });
      });
      return;
    }
    const stageUpBtn = e.target.closest('[data-stage-up]');
    if(stageUpBtn){
      const stageId = stageUpBtn.dataset.stageUp;
      const id = stageUpBtn.dataset.id;
      const stage = STAGES.find(s=>s.id===stageId);
      const record = (stageData[stageId]||[]).find(r=>r.id===id);
      if(!record || !stage.next) return;
      const nextCollection = STAGES.find(s=>s.id===stage.next).collection;
      const copy = { ...record };
      delete copy.id;
      copy.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      copy.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      if(STAGES.find(s=>s.id===stage.next).hasClassDate && !copy.classDates) copy.classDates = [];
      db.collection(nextCollection).add(copy)
        .then(()=>{
          const nextLabel = STAGES.find(s=>s.id===stage.next).label;
          showToast(`${nextLabel} 단계로 이동(복사)되었습니다`, false);
          notifyRecordChange('전도', '단계향상', `${stage.label} → ${nextLabel}`, record.name);
        })
        .catch(err=>{ console.error(err); showToast('단계향상에 실패했습니다.', true); });
      return;
    }
    const addDateBtn = e.target.closest('[data-add-date]');
    if(addDateBtn){
      const stageId = addDateBtn.dataset.addDate;
      const id = addDateBtn.dataset.id;
      const input = document.getElementById(`cd-input-${stageId}-${id}`);
      const dateVal = input.value;
      if(!dateVal) return;
      const record = (stageData[stageId]||[]).find(r=>r.id===id);
      const dates = (record && record.classDates) ? [...record.classDates] : [];
      if(!dates.includes(dateVal)) dates.push(dateVal);
      dates.sort();
      db.collection(STAGES.find(s=>s.id===stageId).collection).doc(id).update({ classDates: dates, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
        .then(()=> showToast('수강 일자가 추가되었습니다', false))
        .catch(err=>{ console.error(err); showToast('날짜 추가에 실패했습니다.', true); });
      return;
    }
  });

  // ==========================================
  // 📝 입력/수정 모달
  // ==========================================
  const formModalOverlay = document.getElementById('formModalOverlay');
  const formModalTitle = document.getElementById('formModalTitle');
  const formConfirmBtn = document.getElementById('formConfirmBtn');
  const formCancelBtn = document.getElementById('formCancelBtn');

  const f_name = document.getElementById('f_name');
  const f_birth = document.getElementById('f_birth');
  const f_phone = document.getElementById('f_phone');
  const f_address = document.getElementById('f_address');
  const f_method = document.getElementById('f_method');
  const f_note = document.getElementById('f_note');

  let formContext = { stageId:null, recordId:null };

  function openFormModal(stageId, record){
    formContext = { stageId, recordId: record ? record.id : null };
    formModalTitle.textContent = record ? `${STAGES.find(s=>s.id===stageId).label} 수정` : `${STAGES.find(s=>s.id===stageId).label} 입력`;

    f_name.value = record ? (record.name||'') : '';
    f_birth.value = record ? (record.birth||'') : '';
    f_phone.value = record ? (record.phone||'') : '';
    f_address.value = record ? (record.address||'') : '';
    f_method.value = record ? (record.method||'지인') : '지인';
    f_note.value = record ? (record.note||'') : '';

    document.querySelectorAll('input[name="f_gender"]').forEach(r=> r.checked = record ? (r.value===record.gender) : false);
    document.querySelectorAll('input[name="f_open"]').forEach(r=> r.checked = record ? (r.value===record.openStatus) : false);

    formModalOverlay.classList.remove('hidden');
    f_name.focus();
  }
  function closeFormModal(){
    formModalOverlay.classList.add('hidden');
    formContext = { stageId:null, recordId:null };
  }
  formCancelBtn.addEventListener('click', closeFormModal);
  formModalOverlay.addEventListener('click', (e)=>{ if(e.target===formModalOverlay) closeFormModal(); });

  formConfirmBtn.addEventListener('click', ()=>{
    const { stageId, recordId } = formContext;
    if(!stageId) return;
    const genderEl = document.querySelector('input[name="f_gender"]:checked');
    const openEl = document.querySelector('input[name="f_open"]:checked');

    if(!f_name.value.trim()){ showToast('이름을 입력해주세요.', true); return; }

    const payload = {
      name: f_name.value.trim(),
      gender: genderEl ? genderEl.value : '',
      birth: f_birth.value || '',
      phone: f_phone.value.trim(),
      address: f_address.value.trim(),
      method: f_method.value,
      openStatus: openEl ? openEl.value : '',
      note: f_note.value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const collection = STAGES.find(s=>s.id===stageId).collection;
    formConfirmBtn.disabled = true;

    let promise;
    if(recordId){
      promise = db.collection(collection).doc(recordId).update(payload);
    } else {
      payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      if(STAGES.find(s=>s.id===stageId).hasClassDate) payload.classDates = [];
      promise = db.collection(collection).add(payload);
    }

    promise
      .then(()=>{
        showToast('저장되었습니다', false);
        closeFormModal();
        const stageLabel = STAGES.find(s=>s.id===stageId).label;
        notifyRecordChange('전도', recordId ? '수정' : '입력', stageLabel, payload.name);
      })
      .catch(err=>{ console.error(err); showToast('저장에 실패했습니다. 네트워크를 확인해주세요.', true); })
      .finally(()=>{ formConfirmBtn.disabled = false; });
  });

  // ==========================================
  // ⚠️ 삭제 확인 모달
  // ==========================================
  const confirmModalOverlay = document.getElementById('confirmModalOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmYesBtn = document.getElementById('confirmYesBtn');
  const confirmNoBtn = document.getElementById('confirmNoBtn');
  let confirmCallback = null;

  function openConfirmModal(message, onYes){
    confirmMessage.textContent = message;
    confirmCallback = onYes;
    confirmModalOverlay.classList.remove('hidden');
  }
  function closeConfirmModal(){
    confirmModalOverlay.classList.add('hidden');
    confirmCallback = null;
  }
  confirmYesBtn.addEventListener('click', ()=>{
    if(confirmCallback) confirmCallback();
    closeConfirmModal();
  });
  confirmNoBtn.addEventListener('click', closeConfirmModal);
  confirmModalOverlay.addEventListener('click', (e)=>{ if(e.target===confirmModalOverlay) closeConfirmModal(); });

  // ==========================================
  // 🍞 토스트
  // ==========================================
  const toast = document.getElementById('saveToast');
  function showToast(message, isError){
    toast.textContent = message || '저장되었습니다';
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1800);
  }
</script>
</body>
</html>
