<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>송촌1부 구역 조직도</title>
<style>
  :root{
    --bg-color:#0f172a;
    --card-bg:#1e293b;
    --accent-color:#a3e635;
    --blue:#bef264;
    --title-color:#f59e0b;
    --text-color:#f8fafc;
    --sub-text:#94a3b8;
    --border-color:#334155;
    --line-color: rgba(163,230,53,0.55);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse at top, rgba(190,242,100,0.08), transparent 60%),
      var(--bg-color);
    color:var(--text-color);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding:36px 20px 120px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* ===== 헤더 ===== */
  .page-header{
    text-align:center;
    margin-bottom:44px;
  }
  .page-header h1{
    display:inline-block;
    margin:0;
    font-size:1.6rem;
    font-weight:800;
    color:var(--title-color);
    letter-spacing:1px;
    text-shadow:0 0 14px rgba(245,158,11,0.45);
  }
  .page-header p{
    margin:8px 0 0;
    color:var(--sub-text);
    font-size:0.85rem;
    letter-spacing:0.5px;
  }

  .chart-wrap{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ===== 공통 노드 박스 ===== */
  .node{
    position:relative;
    background:rgba(30,41,59,0.85);
    border:1.5px solid var(--accent-color);
    border-radius:10px;
    padding:12px 22px;
    text-align:center;
    box-shadow:0 0 14px rgba(163,230,53,0.18), inset 0 0 10px rgba(163,230,53,0.08);
    min-width:120px;
  }
  .node .role-label{
    display:block;
    font-size:0.7rem;
    color:var(--blue);
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:4px;
    text-transform:uppercase;
  }
  .node .name{
    font-size:0.98rem;
    font-weight:800;
    color:var(--text-color);
  }
  .exec-node{ padding:16px 40px; }
  .exec-node .name{ font-size:1.15rem; }

  /* 편집 가능 텍스트 표시 */
  .editable{
    outline:none;
    border-radius:4px;
    padding:1px 4px;
  }
  body.editing .editable{
    background:rgba(190,242,100,0.12);
    box-shadow:0 0 0 1px rgba(190,242,100,0.5) inset;
    cursor:text;
  }

  body.editing .leader-name{ cursor:text; }

  /* ===== 연결선 ===== */
  .stem{
    width:2px;
    height:26px;
    background:var(--line-color);
  }

  /* 2단: 전도팀장/심방팀장/서기 — 3형제 트리 커넥터 */
  .tree-row{
    display:flex;
    justify-content:center;
    position:relative;
    padding-top:26px;
    margin-bottom:0;
  }
  .tree-row .branch{
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    padding:0 26px;
  }
  .tree-row .branch::before,
  .tree-row .branch::after{
    content:'';
    position:absolute;
    top:0;
    width:50%;
    height:26px;
    border-top:2px solid var(--line-color);
  }
  .tree-row .branch::before{ right:50%; }
  .tree-row .branch::after{ left:50%; }
  .tree-row .branch:first-child::before{ border:none; }
  .tree-row .branch:last-child::after{ border:none; }
  .tree-row .branch:first-child::after{ border-radius:0 6px 0 0; }
  .tree-row .branch:last-child::before{ border-radius:6px 0 0 0; }
  .tree-row .branch:only-child::before,
  .tree-row .branch:only-child::after{ display:none; }

  /* 구역 카드 그리드 (제목 배지 제거, 여백만 유지) */
  .zones-grid{
    width:100%;
    margin-top:32px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px;
  }
  @media (max-width: 900px){
    .zones-grid{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width: 640px){
    .zones-grid{ grid-template-columns:repeat(2, 1fr); }
  }

  .zone-card{
    background:rgba(30,41,59,0.85);
    border:1px solid var(--border-color);
    border-top:3px solid var(--accent-color);
    border-radius:10px;
    padding:14px 14px 12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .zone-card .zone-num{
    font-size:0.72rem;
    color:var(--accent-color);
    font-weight:800;
    letter-spacing:1px;
  }

  .leaders-block{
    display:flex;
    flex-direction:column;
    gap:4px;
    border-bottom:1px dashed var(--border-color);
    padding-bottom:8px;
  }
  .leader-row{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .leader-row .leader-tag{
    font-size:0.72rem;
    color:var(--sub-text);
    flex-shrink:0;
    width:52px;
  }
  .leader-row .leader-name{
    font-weight:800;
    font-size:0.95rem;
    color:var(--text-color);
    cursor:pointer;
  }

  .members-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .members-header .members-tag{
    font-size:0.72rem;
    color:var(--sub-text);
    font-weight:700;
  }
  .add-member-btn{
    display:none;
    align-items:center;
    gap:4px;
    background:rgba(190,242,100,0.12);
    border:1px solid var(--blue);
    color:var(--blue);
    font-size:0.7rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
  }
  .add-member-btn:hover{
    background:var(--blue);
    color:#000;
  }
  body.editing .add-member-btn{ display:inline-flex; }

  .members{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
  }
  .members .member{
    font-size:0.82rem;
    color:var(--sub-text);
    cursor:pointer;
  }
  body.editing .members .member{ color:var(--text-color); cursor:text; }

  /* ===== 수정 버튼 ===== */
  .edit-btn-wrap{
    position:fixed;
    left:0; right:0; bottom:26px;
    display:flex;
    justify-content:center;
    gap:12px;
    pointer-events:none;
  }
  #editBtn{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg, #a3e635, #65a30d);
    color:#fff;
    border:none;
    font-weight:800;
    font-size:0.95rem;
    letter-spacing:0.5px;
    padding:13px 30px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 0 16px rgba(163,230,53,0.45), 0 4px 10px rgba(0,0,0,0.4);
    transition:all 0.2s ease;
  }
  #editBtn:hover{
    box-shadow:0 0 22px rgba(190,242,100,0.75), 0 4px 10px rgba(0,0,0,0.4);
    transform:translateY(-1px);
  }
  #editBtn.save-mode{
    background:linear-gradient(135deg, #bef264, #84cc16);
    box-shadow:0 0 16px rgba(190,242,100,0.5), 0 4px 10px rgba(0,0,0,0.4);
  }
  #editBtn.save-mode:hover{
    box-shadow:0 0 22px rgba(190,242,100,0.8), 0 4px 10px rgba(0,0,0,0.4);
  }
  #editBtn:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }

  .save-toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%) translateY(10px);
    background:rgba(15,23,42,0.95);
    border:1px solid var(--blue);
    color:var(--blue);
    font-size:0.82rem;
    font-weight:700;
    padding:8px 18px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:all 0.25s ease;
  }
  .save-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .save-toast.error{
    border-color:#ef4444;
    color:#f87171;
  }

  /* ===== 로그아웃 버튼 ===== */
  .logout-btn-wrap{
    position:fixed;
    left:22px;
    bottom:26px;
  }
  #logoutBtn{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border-color);
    color:var(--sub-text);
    font-weight:700;
    font-size:0.82rem;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    transition:0.2s;
  }
  #logoutBtn:hover{
    color:var(--text-color);
    border-color:var(--sub-text);
  }

  /* ===== 인원수 설정 팝업 ===== */
  .popup-overlay{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    background:rgba(5,10,20,0.7);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
  }
  .popup-overlay.hidden{ display:none; }
  .popup-card{
    width:300px;
    max-width:88%;
    background:rgba(15,23,42,0.95);
    border:1.5px solid var(--blue);
    border-radius:14px;
    box-shadow:0 0 22px rgba(190,242,100,0.35), inset 0 0 12px rgba(190,242,100,0.1);
    padding:22px 22px 18px;
  }
  .popup-title{
    color:var(--blue);
    font-weight:800;
    font-size:1rem;
    margin-bottom:14px;
    text-shadow:0 0 8px rgba(190,242,100,0.5);
  }
  .popup-card input[type="number"]{
    width:100%;
    background:rgba(10,15,26,0.6);
    border:1px solid var(--blue);
    border-radius:8px;
    color:var(--text-color);
    font-size:1rem;
    padding:10px 12px;
    outline:none;
    box-sizing:border-box;
  }
  .popup-card input[type="number"]:focus{
    box-shadow:0 0 10px rgba(190,242,100,0.5);
  }
  .popup-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .popup-actions button{
    flex:1;
    padding:10px 0;
    border-radius:8px;
    font-weight:800;
    font-size:0.9rem;
    cursor:pointer;
    border:none;
    transition:0.2s;
  }
  #countPopupConfirm{
    background:linear-gradient(135deg, #bef264, #84cc16);
    color:#fff;
  }
  #countPopupConfirm:hover{ box-shadow:0 0 14px rgba(190,242,100,0.7); }
  #countPopupCancel{
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border-color) !important;
    color:var(--sub-text);
  }
  #countPopupCancel:hover{ color:var(--text-color); }

  /* ===== 이름 클릭 시 보이는 구역원 정보 보기 팝업 ===== */
  .view-popup-card{
    width:320px;
    max-width:90%;
    background:linear-gradient(160deg, rgba(30,41,59,0.97), rgba(15,23,42,0.97));
    border:1.5px solid var(--accent-color);
    border-radius:16px;
    box-shadow:0 0 26px rgba(163,230,53,0.3), 0 8px 24px rgba(0,0,0,0.45);
    padding:26px 24px 20px;
  }
  .view-popup-name{
    font-size:1.15rem;
    font-weight:800;
    color:var(--title-color);
    text-align:center;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--border-color);
  }
  .view-popup-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    font-size:0.9rem;
  }
  .view-popup-row .vp-label{
    width:64px;
    flex-shrink:0;
    color:var(--sub-text);
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.5px;
  }
  .view-popup-row .vp-value{
    color:var(--text-color);
    font-weight:600;
    flex:1;
  }
  .view-popup-empty{
    text-align:center;
    color:var(--sub-text);
    font-size:0.85rem;
    padding:10px 0;
  }
  .view-popup-close{
    width:100%;
    margin-top:16px;
    padding:10px 0;
    border-radius:8px;
    border:1px solid var(--border-color);
    background:rgba(255,255,255,0.06);
    color:var(--sub-text);
    font-weight:700;
    font-size:0.88rem;
    cursor:pointer;
    transition:0.2s;
  }
  .view-popup-close:hover{ color:var(--text-color); }

  /* ===== 구역원 정보 입력 모달 ===== */
  .info-modal-card{
    width:420px;
    max-width:92%;
    max-height:86vh;
    overflow-y:auto;
    background:rgba(15,23,42,0.97);
    border:1.5px solid var(--blue);
    border-radius:16px;
    box-shadow:0 0 26px rgba(190,242,100,0.3), 0 8px 24px rgba(0,0,0,0.45);
    padding:24px 22px 20px;
  }
  .info-modal-title{
    color:var(--blue);
    font-weight:800;
    font-size:1.05rem;
    margin-bottom:16px;
    text-shadow:0 0 8px rgba(190,242,100,0.5);
  }
  .info-search-wrap{ position:relative; margin-bottom:14px; }
  .info-search-wrap input{
    width:100%;
    background:rgba(10,15,26,0.6);
    border:1px solid var(--blue);
    border-radius:8px;
    color:var(--text-color);
    font-size:0.92rem;
    padding:10px 12px;
    outline:none;
    box-sizing:border-box;
  }
  .info-search-results{
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    background:rgba(20,28,44,0.98);
    border:1px solid var(--blue);
    border-radius:8px;
    max-height:180px;
    overflow-y:auto;
    z-index:20;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .info-search-results.hidden{ display:none; }
  .info-search-results .result-item{
    padding:9px 12px;
    font-size:0.88rem;
    cursor:pointer;
    color:var(--text-color);
  }
  .info-search-results .result-item:hover{ background:rgba(190,242,100,0.15); }
  .info-search-empty{
    padding:9px 12px;
    font-size:0.82rem;
    color:var(--sub-text);
  }

  .info-form-group{ margin-bottom:12px; }
  .info-form-group label{
    display:block;
    font-size:0.76rem;
    color:var(--sub-text);
    font-weight:700;
    margin-bottom:5px;
  }
  .info-form-group .info-name-display{
    background:rgba(190,242,100,0.1);
    border:1px solid var(--blue);
    border-radius:8px;
    padding:9px 12px;
    font-weight:800;
    color:var(--blue);
    font-size:0.92rem;
  }
  .info-form-group input{
    width:100%;
    background:rgba(10,15,26,0.6);
    border:1px solid var(--border-color);
    border-radius:8px;
    color:var(--text-color);
    font-size:0.9rem;
    padding:9px 12px;
    outline:none;
    box-sizing:border-box;
  }
  .info-form-group input:focus{ border-color:var(--blue); box-shadow:0 0 8px rgba(190,242,100,0.4); }

  #memberFormSaveBtn{
    width:100%;
    padding:10px 0;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg, #a3e635, #65a30d);
    color:#fff;
    font-weight:800;
    font-size:0.9rem;
    cursor:pointer;
    margin-top:4px;
  }
  #memberFormSaveBtn:disabled{ opacity:0.55; cursor:not-allowed; }

  .info-list-title{
    margin:20px 0 8px;
    padding-top:14px;
    border-top:1px dashed var(--border-color);
    font-size:0.78rem;
    color:var(--sub-text);
    font-weight:700;
  }
  .info-list{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
  .info-list-item{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border-color);
    border-radius:8px;
    padding:8px 10px;
  }
  .info-list-item .ili-name{
    font-weight:800;
    font-size:0.86rem;
    color:var(--text-color);
    flex-shrink:0;
    min-width:56px;
  }
  .info-list-item .ili-summary{
    flex:1;
    font-size:0.78rem;
    color:var(--sub-text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .info-list-item .ili-edit,
  .info-list-item .ili-delete{
    flex-shrink:0;
    border:none;
    border-radius:6px;
    font-size:0.74rem;
    font-weight:700;
    padding:5px 9px;
    cursor:pointer;
  }
  .info-list-item .ili-edit{ background:rgba(190,242,100,0.15); color:var(--blue); }
  .info-list-item .ili-edit:hover{ background:var(--blue); color:#000; }
  .info-list-item .ili-delete{ background:rgba(239,68,68,0.15); color:#f87171; }
  .info-list-item .ili-delete:hover{ background:#ef4444; color:#fff; }
  .info-list-empty{ color:var(--sub-text); font-size:0.82rem; padding:8px 2px; }

  #memberInfoDoneBtn{
    width:100%;
    margin-top:18px;
    padding:11px 0;
    border-radius:8px;
    border:1px solid var(--border-color);
    background:rgba(255,255,255,0.06);
    color:var(--sub-text);
    font-weight:700;
    font-size:0.9rem;
    cursor:pointer;
    transition:0.2s;
  }
  #memberInfoDoneBtn:hover{ color:var(--text-color); }

  /* 편집모드에서만 보이는 "구역원 정보 입력" 버튼 */
  #memberInfoBtn{
    display:none;
    pointer-events:auto;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.06);
    border:1.5px solid var(--blue);
    color:var(--blue);
    font-weight:800;
    font-size:0.9rem;
    padding:13px 22px;
    border-radius:30px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  #memberInfoBtn:hover{ background:var(--blue); color:#000; }
  body.editing #memberInfoBtn{ display:flex; }

  /* ===== 닫기 버튼 ===== */
  .close-window-btn{
    position:fixed;
    top:18px;
    right:22px;
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(30,41,59,0.85);
    border:1.5px solid var(--accent-color);
    color:var(--accent-color);
    font-size:1.4rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10000;
    box-shadow:0 0 10px rgba(163,230,53,0.25);
    transition:all 0.2s ease;
  }
  .close-window-btn:hover{
    background:var(--accent-color);
    color:#0f172a;
    box-shadow:0 0 16px rgba(163,230,53,0.6);
    transform:scale(1.05);
  }

  /* ===== 메인 콘텐츠 로그인 전 숨김 ===== */
  .main-content-hidden{
    display:none !important;
  }

  /* ===== 로그인 / 가입 / 비밀번호 수정 오버레이 ===== */
  .login-overlay{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(190,242,100,0.08), transparent 60%),
      rgba(5,10,20,0.92);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20000;
  }
  .login-overlay.hidden{ display:none; }

  .login-card{
    width:340px;
    max-width:90%;
    background:rgba(15,23,42,0.95);
    border:1.5px solid var(--accent-color);
    border-radius:16px;
    box-shadow:0 0 26px rgba(163,230,53,0.3), inset 0 0 14px rgba(163,230,53,0.08);
    padding:28px 26px 24px;
  }

  .login-title{
    margin:0 0 20px;
    text-align:center;
    font-size:1.15rem;
    font-weight:800;
    color:var(--title-color);
    text-shadow:0 0 10px rgba(245,158,11,0.4);
  }

  .login-form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
  }
  .login-form-group label{
    font-size:0.78rem;
    font-weight:700;
    color:var(--sub-text);
  }
  .login-form-group input{
    width:100%;
    background:rgba(10,15,26,0.6);
    border:1px solid var(--border-color);
    border-radius:8px;
    color:var(--text-color);
    font-size:0.92rem;
    padding:10px 12px;

<script>
  // ==========================================
  // ⚠️ Firebase 설정 - Firebase 콘솔에서 프로젝트 생성 후
  //    "프로젝트 설정 > 일반 > 내 앱"에서 복사한 값으로 교체하세요.
  //
  //    설정 절차 요약:
  //    1) https://console.firebase.google.com 에서 새 프로젝트 생성
  //    2) Authentication > Sign-in method > 이메일/비밀번호 사용 설정
  //    3) Firestore Database 생성 (프로덕션 모드 권장, 위치는 asia-northeast3(서울))
  //    4) Firestore 보안 규칙에서 로그인한 사용자만 읽기/쓰기 가능하도록 설정
  //       예)
  //       rules_version = '2';
  //       service cloud.firestore {
  //         match /databases/{database}/documents {
  //           match /orgChart/{docId} {
  //             allow read, write: if request.auth != null;
  //           }
  //         }
  //       }
  //    5) 아래 firebaseConfig 값을 실제 값으로 교체
  //    6) jeongyk0729@gmail.com 계정은 아래 [가입] 버튼으로 직접 만들거나
  //       Firebase 콘솔 > Authentication > Users 에서 수동으로 추가
  //    7) file:// 로 열면 일부 기능이 제한될 수 있으니 Vercel 등 실제
  //       웹 서버 주소로 접속해서 사용하세요.
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyBVXo5NYSyumJxYFFE2hrIaTEJiHIyq8P0",
    authDomain: "my-secretary-1df10.firebaseapp.com",
    projectId: "my-secretary-1df10",
    storageBucket: "my-secretary-1df10.firebasestorage.app",
    messagingSenderId: "165274759452",
    appId: "1:165274759452:web:bbfa7de28a08f8e11b4ad9",
    measurementId: "G-TVB8JR7B3W"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ==========================================
  // ✅ 로그인 상태 유지
  // - 모든 페이지(구역/전도/심방/활동/홈)가 같은 Firebase 프로젝트의
  //   기본 인증 세션을 공유하므로, 한 번 로그인하면 다른 페이지로
  //   이동해도 다시 로그인할 필요가 없습니다.
  // ==========================================
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .catch(err => console.error('Persistence 설정 오류:', err));

  // ==========================================
  // 🔐 로그인 모듈 (Firebase Authentication)
  // ==========================================
  const loginOverlay = document.getElementById('loginOverlay');
  const mainContent = document.getElementById('mainContent');

  // 브라우저 자동완성으로 채워질 수 있는 입력값을 페이지 로드 직후 강제로 비웁니다.
  function clearLoginInputs() {
    ['loginPassword'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  }
  window.addEventListener('load', () => { setTimeout(clearLoginInputs, 50); });
  clearLoginInputs();

  // 뒤로가기 버튼: 팝업으로 열렸으면 창을 닫아 홈으로 복귀, 아니면 브라우저 뒤로가기
  function goToHome() {
    if (window.opener && !window.opener.closed) {
      window.close();
    } else if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = 'index.html';
    }
  }
  document.getElementById('loginBackBtn').addEventListener('click', goToHome);

  // 브라우저 캐시(bfcache)로 이 페이지에 되돌아왔을 때 이전 화면이 그대로
  // 남아있지 않도록 새로고침하여 로그인 상태를 다시 정확히 확인합니다.
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) window.location.reload();
  });

  function showOnlyOverlay(target) {
    loginOverlay.classList.toggle('hidden', target !== loginOverlay);
  }

  function clearError(el) {
    el.classList.add('hidden');
    el.textContent = '';
  }

  function showError(el, message) {
    el.textContent = message;
    el.classList.remove('hidden');
  }

  // Firebase 에러 코드를 한국어 메시지로 변환
  function mapFirebaseError(err) {
    const code = err && err.code ? err.code : '';
    switch (code) {
      case 'auth/invalid-email':
        return '올바른 이메일 형식이 아닙니다.';
      case 'auth/user-not-found':
        return '가입되지 않은 이메일입니다.';
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
        return '이메일 또는 비밀번호가 올바르지 않습니다.';
      case 'auth/email-already-in-use':
        return '이미 가입된 이메일입니다.';
      case 'auth/weak-password':
        return '비밀번호는 6자리 이상이어야 합니다.';
      case 'auth/too-many-requests':
        return '너무 많은 시도가 있었습니다. 잠시 후 다시 시도해주세요.';
      case 'auth/network-request-failed':
        return '네트워크 연결을 확인해주세요.';
      case 'auth/api-key-not-valid':
      case 'auth/invalid-api-key':
        return 'Firebase 설정값(firebaseConfig)이 아직 교체되지 않았습니다.';
      default:
        return '오류가 발생했습니다: ' + (err && err.message ? err.message : code);
    }
  }

  // ---- 로그인 처리 ----
  const loginEmailInput = document.getElementById('loginEmail');
  const loginPasswordInput = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');
  const loginSubmitBtn = document.getElementById('loginSubmitBtn');

  function attemptLogin() {
    const email = loginEmailInput.value.trim();
    const pw = loginPasswordInput.value;

    if (!email || !pw) {
      showError(loginError, '이메일과 비밀번호를 입력해주세요.');
      return;
    }

    clearError(loginError);
    loginSubmitBtn.disabled = true;

    auth.signInWithEmailAndPassword(email, pw)
      .then(() => {
        loginPasswordInput.value = '';
      })
      .catch(err => {
        showError(loginError, mapFirebaseError(err));
      })
      .finally(() => {
        loginSubmitBtn.disabled = false;
      });
  }

  loginSubmitBtn.addEventListener('click', attemptLogin);
  [loginEmailInput, loginPasswordInput].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); attemptLogin(); }
    });
  });


  // ---- 로그아웃 ----
  document.getElementById('logoutBtn').addEventListener('click', () => {
    auth.signOut();
  });

  // ---- 로그인 상태에 따른 화면 전환 + Firestore 동기화 시작/중지 ----
  auth.onAuthStateChanged(user => {
    if (user) {
      showOnlyOverlay(null);
      mainContent.classList.remove('main-content-hidden');
      startOrgChartSync();
      startMemberInfoSync();
    } else {
      mainContent.classList.add('main-content-hidden');
      showOnlyOverlay(loginOverlay);
      stopOrgChartSync();
      stopMemberInfoSync();
    }
  });

  // 편집 모드 여부 (다른 함수들에서 참조하므로 최상단에서 먼저 선언)
  let editing = false;

  // 우측 상단 닫기 버튼
  document.getElementById('closeWindowBtn').addEventListener('click', () => {
    window.close();
  });

  // ---- 구역 카드 12개 동적 생성 (구역원은 처음엔 1칸) ----
  const grid = document.getElementById('zonesGrid');
  for (let i = 1; i <= 12; i++) {
    const card = document.createElement('div');
    card.className = 'zone-card';
    card.innerHTML = `
      <span class="zone-num">${i}구역</span>
      <div class="leaders-block">
        <div class="leader-row">
          <span class="leader-tag">구역장</span>
          <span class="leader-name editable" contenteditable="false" data-key="zone-${i}-leader">이름 입력</span>
        </div>
        <div class="leader-row">
          <span class="leader-tag">부구역장</span>
          <span class="leader-name editable" contenteditable="false" data-key="zone-${i}-subleader">이름 입력</span>
        </div>
      </div>
      <div class="members-header">
        <span class="members-tag">구역원</span>
        <button type="button" class="add-member-btn" data-zone="${i}">인원수 설정</button>
      </div>
      <div class="members" id="members-${i}"></div>
    `;
    grid.appendChild(card);
  }

  const zoneMemberCounts = {};

  function renderZoneMembers(zoneNum, count, values) {
    const container = document.getElementById(`members-${zoneNum}`);
    let html = '';
    for (let idx = 1; idx <= count; idx++) {
      const val = (values && values[idx]) ? values[idx] : '구역원';
      html += `<span class="member editable" contenteditable="${editing ? 'true' : 'false'}" data-key="zone-${zoneNum}-member-${idx}">${val}</span>`;
    }
    container.innerHTML = html;
    zoneMemberCounts[zoneNum] = count;
  }

  // 초기: 구역별 구역원 입력칸 1개씩 (Firestore 데이터가 로드되면 덮어써짐)
  for (let i = 1; i <= 12; i++) {
    renderZoneMembers(i, 1);
  }

  // 인원수 설정 버튼 → 자체 팝업창으로 숫자 입력받기
  const countPopupOverlay = document.getElementById('countPopupOverlay');
  const countPopupTitle = document.getElementById('countPopupTitle');
  const countPopupInput = document.getElementById('countPopupInput');
  const countPopupConfirm = document.getElementById('countPopupConfirm');
  const countPopupCancel = document.getElementById('countPopupCancel');
  let popupTargetZone = null;

  function openCountPopup(zoneNum) {
    popupTargetZone = zoneNum;
    countPopupTitle.textContent = `${zoneNum}구역 구역원 수를 입력하세요`;
    countPopupInput.value = zoneMemberCounts[zoneNum] || 1;
    countPopupOverlay.classList.remove('hidden');
    countPopupInput.focus();
    countPopupInput.select();
  }

  function closeCountPopup() {
    countPopupOverlay.classList.add('hidden');
    popupTargetZone = null;
  }

  function applyCountPopup() {
    if (popupTargetZone === null) return;
    const zoneNum = popupTargetZone;

    let count = parseInt(countPopupInput.value, 10);
    if (isNaN(count) || count < 1) count = 1;
    if (count > 20) count = 20;

    // 기존에 입력된 이름은 최대한 보존
    const existingValues = {};
    document.querySelectorAll(`#members-${zoneNum} .member`).forEach((el, i) => {
      existingValues[i + 1] = el.innerText.trim();
    });

    renderZoneMembers(zoneNum, count, existingValues);
    closeCountPopup();
  }

  document.querySelectorAll('.add-member-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openCountPopup(btn.dataset.zone);
    });
  });

  countPopupConfirm.addEventListener('click', applyCountPopup);
  countPopupCancel.addEventListener('click', closeCountPopup);
  countPopupInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); applyCountPopup(); }
    if (e.key === 'Escape') { e.preventDefault(); closeCountPopup(); }
  });
  countPopupOverlay.addEventListener('click', (e) => {
    if (e.target === countPopupOverlay) closeCountPopup();
  });

  // ==========================================
  // ☁️ Firestore 실시간 저장 / 불러오기 (orgChart/main 문서)
  // ==========================================
  const orgDocRef = db.collection('orgChart').doc('main');
  let unsubscribeOrgChart = null;
  let suppressNextSnapshot = false;

  function applyOrgChartData(data) {
    if (!data) return;

    // 구역원 수 먼저 복원 후 값 채우기
    if (data.__memberCounts) {
      for (let i = 1; i <= 12; i++) {
        const count = data.__memberCounts[i] || 1;
        const values = {};
        for (let idx = 1; idx <= count; idx++) {
          const key = `zone-${i}-member-${idx}`;
          if (data[key]) values[idx] = data[key];
        }
        renderZoneMembers(i, count, values);
      }
    }

    document.querySelectorAll('.editable').forEach(el => {
      if (el.classList.contains('member')) return; // 위에서 이미 처리됨
      if (data[el.dataset.key]) el.innerText = data[el.dataset.key];
    });
  }

  function saveOrgChartData() {
    const data = { __memberCounts: zoneMemberCounts };
    document.querySelectorAll('.editable').forEach(el => {
      data[el.dataset.key] = el.innerText.trim();
    });

    suppressNextSnapshot = true;
    return orgDocRef.set(data);
  }

  function startOrgChartSync() {
    if (unsubscribeOrgChart) return; // 이미 구독 중이면 중복 방지
    unsubscribeOrgChart = orgDocRef.onSnapshot(
      docSnap => {
        if (suppressNextSnapshot) {
          suppressNextSnapshot = false;
          return;
        }
        // 편집 중일 때는 다른 기기의 변경사항으로 현재 입력값을 덮어쓰지 않음
        if (editing) return;
        if (docSnap.exists) {
          applyOrgChartData(docSnap.data());
        }
      },
      err => {
        console.error('Firestore 동기화 오류:', err);
        showToast('데이터 동기화에 실패했습니다.', true);
      }
    );
  }

  function stopOrgChartSync() {
    if (unsubscribeOrgChart) {
      unsubscribeOrgChart();
      unsubscribeOrgChart = null;
    }
  }

  // ==========================================
  // 📇 구역원 상세 정보 (이름/생년월일/연락처/사는곳)
  //    - Firestore 컬렉션: zoneMemberInfo (문서 ID = 이름)
  //    - Firestore 규칙에 아래 항목 추가가 필요합니다:
  //      match /zoneMemberInfo/{docId} { allow read, write: if request.auth != null; }
  // ==========================================
  const memberInfoCol = db.collection('zoneMemberInfo');
  let memberInfoCache = {};
  let unsubscribeMemberInfo = null;

  function startMemberInfoSync() {
    if (unsubscribeMemberInfo) return;
    unsubscribeMemberInfo = memberInfoCol.onSnapshot(
      snap => {
        memberInfoCache = {};
        snap.forEach(doc => { memberInfoCache[doc.id] = doc.data(); });
        renderMemberInfoList();
      },
      err => console.error('구역원 정보 동기화 오류:', err)
    );
  }

  function stopMemberInfoSync() {
    if (unsubscribeMemberInfo) {
      unsubscribeMemberInfo();
      unsubscribeMemberInfo = null;
    }
  }

  // 현재 조직도에 실제로 입력되어 있는 이름들만 모아서 반환 (중복/빈값/기본안내문구 제외)
  function getOrgChartNames() {
    const placeholders = new Set(['이름 입력', '구역원']);
    const names = new Set();
    document.querySelectorAll('.leader-name, .members .member').forEach(el => {
      const val = el.innerText.trim();
      if (val && !placeholders.has(val)) names.add(val);
    });
    return Array.from(names).sort((a, b) => a.localeCompare(b, 'ko'));
  }

  // ---- 이름 클릭 시 정보 보기 팝업 ----
  const memberViewOverlay = document.getElementById('memberViewOverlay');
  const viewPopupName = document.getElementById('viewPopupName');
  const viewPopupBody = document.getElementById('viewPopupBody');
  const viewPopupEmpty = document.getElementById('viewPopupEmpty');
  const viewPopupBirth = document.getElementById('viewPopupBirth');
  const viewPopupPhone = document.getElementById('viewPopupPhone');
  const viewPopupAddress = document.getElementById('viewPopupAddress');

  function openMemberView(name) {
    viewPopupName.textContent = name;
    const info = memberInfoCache[name];
    if (info) {
      viewPopupBirth.textContent = info.birth || '-';
      viewPopupPhone.textContent = info.phone || '-';
      viewPopupAddress.textContent = info.address || '-';
      viewPopupBody.classList.remove('hidden');
      viewPopupEmpty.classList.add('hidden');
    } else {
      viewPopupBody.classList.add('hidden');
      viewPopupEmpty.classList.remove('hidden');
    }
    memberViewOverlay.classList.remove('hidden');
  }

  document.getElementById('viewPopupCloseBtn').addEventListener('click', () => {
    memberViewOverlay.classList.add('hidden');
  });
  memberViewOverlay.addEventListener('click', (e) => {
    if (e.target === memberViewOverlay) memberViewOverlay.classList.add('hidden');
  });

  // 조직도 이름칸 클릭 (편집 모드가 아닐 때만 정보 보기 팝업)
  document.getElementById('zonesGrid').addEventListener('click', (e) => {
    if (editing) return;
    const nameEl = e.target.closest('.leader-name, .members .member');
    if (!nameEl) return;
    const name = nameEl.innerText.trim();
    if (!name || name === '이름 입력' || name === '구역원') return;
    openMemberView(name);
  });

  // ---- 구역원 정보 입력 모달 ----
  const memberInfoOverlay = document.getElementById('memberInfoOverlay');
  const memberInfoBtn = document.getElementById('memberInfoBtn');
  const memberSearchInput = document.getElementById('memberSearchInput');
  const memberSearchResults = document.getElementById('memberSearchResults');
  const memberFormName = document.getElementById('memberFormName');
  const memberFormBirth = document.getElementById('memberFormBirth');
  const memberFormPhone = document.getElementById('memberFormPhone');
  const memberFormAddress = document.getElementById('memberFormAddress');
  const memberFormSaveBtn = document.getElementById('memberFormSaveBtn');
  const memberInfoList = document.getElementById('memberInfoList');
  let selectedMemberName = null;

  function resetMemberForm() {
    selectedMemberName = null;
    memberFormName.textContent = '이름을 검색해서 선택하세요';
    memberFormBirth.value = '';
    memberFormPhone.value = '';
    memberFormAddress.value = '';
    memberFormSaveBtn.disabled = true;
    memberSearchInput.value = '';
    memberSearchResults.classList.add('hidden');
  }

  function selectMemberName(name) {
    selectedMemberName = name;
    memberFormName.textContent = name;
    const info = memberInfoCache[name];
    memberFormBirth.value = (info && info.birth) || '';
    memberFormPhone.value = (info && info.phone) || '';
    memberFormAddress.value = (info && info.address) || '';
    memberFormSaveBtn.disabled = false;
    memberSearchInput.value = name;
    memberSearchResults.classList.add('hidden');
  }

  memberInfoBtn.addEventListener('click', () => {
    resetMemberForm();
    renderMemberInfoList();
    memberInfoOverlay.classList.remove('hidden');
  });

  document.getElementById('memberInfoDoneBtn').addEventListener('click', () => {
    memberInfoOverlay.classList.add('hidden');
  });
  memberInfoOverlay.addEventListener('click', (e) => {
    if (e.target === memberInfoOverlay) memberInfoOverlay.classList.add('hidden');
  });

  memberSearchInput.addEventListener('input', () => {
    const q = memberSearchInput.value.trim().toLowerCase();
    const names = getOrgChartNames();
    const matches = q ? names.filter(n => n.toLowerCase().includes(q)) : names;

    if (matches.length === 0) {
      memberSearchResults.innerHTML = '<div class="info-search-empty">조직도에서 이름을 찾을 수 없습니다.</div>';
    } else {
      memberSearchResults.innerHTML = matches
        .slice(0, 10)
        .map(n => `<div class="result-item" data-name="${n}">${n}</div>`)
        .join('');
    }
    memberSearchResults.classList.remove('hidden');
  });

  memberSearchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.result-item');
    if (!item) return;
    selectMemberName(item.dataset.name);
  });

  memberSearchInput.addEventListener('focus', () => {
    memberSearchInput.dispatchEvent(new Event('input'));
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.info-search-wrap')) {
      memberSearchResults.classList.add('hidden');
    }
  });

  memberFormSaveBtn.addEventListener('click', () => {
    if (!selectedMemberName) return;
    memberFormSaveBtn.disabled = true;
    memberInfoCol.doc(selectedMemberName).set({
      name: selectedMemberName,
      birth: memberFormBirth.value.trim(),
      phone: memberFormPhone.value.trim(),
      address: memberFormAddress.value.trim()
    })
      .then(() => {
        showToast('저장되었습니다', false);
        resetMemberForm();
      })
      .catch(err => {
        console.error('구역원 정보 저장 실패:', err);
        showToast('저장에 실패했습니다.', true);
        memberFormSaveBtn.disabled = false;
      });
  });

  function renderMemberInfoList() {
    const names = Object.keys(memberInfoCache).sort((a, b) => a.localeCompare(b, 'ko'));
    if (names.length === 0) {
      memberInfoList.innerHTML = '<div class="info-list-empty">아직 등록된 정보가 없습니다.</div>';
      return;
    }
    memberInfoList.innerHTML = names.map(name => {
      const info = memberInfoCache[name];
      const summary = [info.birth, info.phone, info.address].filter(Boolean).join(' / ') || '정보 없음';
      return `
        <div class="info-list-item">
          <span class="ili-name">${name}</span>
          <span class="ili-summary">${summary}</span>
          <button type="button" class="ili-edit" data-name="${name}">수정</button>
          <button type="button" class="ili-delete" data-name="${name}">삭제</button>
        </div>`;
    }).join('');
  }

  memberInfoList.addEventListener('click', (e) => {
    const editBtnEl = e.target.closest('.ili-edit');
    const delBtnEl = e.target.closest('.ili-delete');
    if (editBtnEl) {
      selectMemberName(editBtnEl.dataset.name);
      return;
    }
    if (delBtnEl) {
      const name = delBtnEl.dataset.name;
      if (!confirm(`'${name}'님의 정보를 삭제하시겠습니까?`)) return;
      memberInfoCol.doc(name).delete()
        .then(() => {
          showToast('삭제되었습니다', false);
          if (selectedMemberName === name) resetMemberForm();
        })
        .catch(err => {
          console.error('삭제 실패:', err);
          showToast('삭제에 실패했습니다.', true);
        });
    }
  });

  // ---- 수정 버튼 토글 ----
  const editBtn = document.getElementById('editBtn');
  const toast = document.getElementById('saveToast');

  function showToast(message, isError) {
    toast.textContent = message || '저장되었습니다';
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  editBtn.addEventListener('click', () => {
    editing = !editing;
    document.querySelectorAll('.editable').forEach(el => {
      el.contentEditable = editing ? 'true' : 'false';
    });
    document.body.classList.toggle('editing', editing);

    if (editing) {
      editBtn.textContent = '💾 저장';
      editBtn.classList.add('save-mode');
    } else {
      editBtn.textContent = '✏️ 수정';
      editBtn.classList.remove('save-mode');
      editBtn.disabled = true;

      saveOrgChartData()
        .then(() => showToast('저장되었습니다', false))
        .catch(err => {
          console.error('저장 실패:', err);
          showToast('저장에 실패했습니다. 네트워크를 확인해주세요.', true);
        })
        .finally(() => {
          editBtn.disabled = false;
        });
    }
  });
</script>
</body>
</html>
